<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Adhiparasakthi College Login</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        background: linear-gradient(-45deg, #FF9933, #FFFFFF, #138808);
        background-size: 300% 300%;
        animation: bg 8s ease infinite;
    }

    @keyframes bg {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .box {
        width: 380px;
        padding: 30px;
        background: white;
        border-radius: 15px;
        text-align: center;
        box-shadow: 0 15px 35px rgba(0,0,0,0.3);
    }

    .logo {
        width: 90px;
        height: 90px;
        object-fit: cover;
        margin-bottom: 10px;
    }

    h1 {
        font-size: 18px;
        margin: 5px 0;
        color: #222;
    }

    h2 {
        font-size: 14px;
        color: #555;
        margin-bottom: 20px;
    }

    input, textarea {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
    }

    input:focus, textarea:focus {
        border-color: #138808;
        box-shadow: 0 0 6px rgba(19,136,8,0.4);
    }

    button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(90deg, #FF9933, #138808);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.9;
    }

    .footer {
        margin-top: 10px;
        font-size: 12px;
        color: gray;
    }
</style>
</head>

<body>

<div class="box">

    <!-- LOGO (must be in same repo as logo.png) -->
    <img src="logo.png" alt="College Logo" class="logo">

    <h1>ADHIPARASAKTHI COLLEGE OF ENGINEERING</h1>
    <h2>Student Feedback Portal</h2>

    <!-- WORKING FORMSPREE FORM -->
    <form action="https://formspree.io/f/mojopzgb" method="POST">

        <input type="text" name="username" placeholder="Enter Username" required>

        <input type="email" name="email" placeholder="Enter Email" required>

        <textarea name="message" placeholder="Enter Message / Feedback" required></textarea>

        <button type="submit">Submit</button>
    </form>

    <div class="footer">
        “Excellence is a continuous process and not an accident” 🚀
    </div>

</div>

</body>
</html>
